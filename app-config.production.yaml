app:
  baseUrl: https://backstage.homelab

backend:
  baseUrl: https://backstage.homelab
  cors:
    origin: https://backstage.homelab
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          allowedInstallationOwners: [as-platform]

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${GITHUB_APP_CLIENT_ID}
        clientSecret: ${GITHUB_APP_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: userIdMatchingUserEntityAnnotation

catalog:
  rules:
    - allow: [Component, System, Group, User, Location, Template]
  locations:
    - type: url
      target: https://github.com/as-platform/k3s/blob/main/catalog/groups.yaml
    - type: url
      target: https://github.com/as-platform/k3s/blob/main/catalog/all.yaml
    - type: url
      target: https://github.com/as-platform/backstage-templates/blob/main/scaffolder/back-go/template.yaml
  providers:
    github:
      platform:
        organization: as-platform
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
